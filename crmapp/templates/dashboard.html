{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script> 

    <style>
        body {
            background-color: #f8f9fa;
            font-family: Arial, sans-serif;
        }
        .container {
            max-width: 1200px;
            margin: 20px auto;
        }
        .total {
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            padding: 10px;
            min-height: 80px; /* Reduced height */
            background: #28a745;
            color: white;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .total_result {
            color: white;
            font-size: 22px;
            font-weight: bold;
        }
        .card {
            border-radius: 10px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
            padding: 10px; /* Reduced padding */
            background-color: #ffffff;
            margin-bottom: 15px;
            text-align: center;
        }
        .chart-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .chart-box {
            width: 48%;
            min-width: 300px;
        }
        .table-container {
            overflow-x: auto;
        }
        .table th {
            background-color: #2c3e50;
            color: white;
        }
    </style>
</head>
<body>

    {% include 'navdash.html' %}

    <div class="container">
        <h2 class="text-center mb-4">Dashboard</h2>

        <!-- Lead Summary (Side by Side Cards) -->
        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="total">
                        <h5>Total Leads</h5>
                        <div class="total_result">{{ total_leads }}</div>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="total">
                        <h5>Total Customers</h5>
                        <div class="total_result">{{ total_customers }}</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Charts Container -->
        <div class="card">
            <h4 class="text-center">Analytics</h4>
            <div class="chart-container">
                <div class="chart-box">
                    <h5 class="text-center">Incoming Leads (Month-wise)</h5>
                    <canvas id="incomingLeadsChart"></canvas>
                </div>
                <div class="chart-box">
                    <h5 class="text-center">Opportunity Trends (Month-wise)</h5>
                    <canvas id="opportunityTrendsChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Item Demand Graph -->
        <div class="card">
            <h4 class="text-center">Most Demanded Items</h4>
            <canvas id="itemDemandChart"></canvas>
        </div>
    </div>

    <script>
        // Incoming Leads Chart
        var ctx1 = document.getElementById('incomingLeadsChart').getContext('2d');
        new Chart(ctx1, {
            type: 'line',
            data: {
                labels: {{ lead_months|safe }},
                datasets: [{
                    label: 'Incoming Leads',
                    data: {{ lead_counts|safe }},
                    borderColor: 'rgb(255, 99, 132)',
                    fill: false
                }]
            }
        });

        // Opportunity Trends Chart
        var ctx2 = document.getElementById('opportunityTrendsChart').getContext('2d');
        new Chart(ctx2, {
            type: 'line',
            data: {
                labels: {{ opportunity_months|safe }},
                datasets: [{
                    label: 'Opportunities',
                    data: {{ opportunity_counts|safe }},
                    borderColor: 'rgb(75, 192, 192)',
                    fill: false
                }]
            }
        });

        // Item Demand Bar Chart
        var ctx3 = document.getElementById('itemDemandChart').getContext('2d');
        new Chart(ctx3, {
            type: 'bar',
            data: {
                labels: {{ item_names|safe }},
                datasets: [{
                    label: 'Demand Count',
                    data: {{ item_counts|safe }},
                    backgroundColor: ['#ff6384', '#36a2eb', '#ffce56', '#4bc0c0', '#9966ff'],
                }]
            }
        });
    </script>

</body>
</html>
