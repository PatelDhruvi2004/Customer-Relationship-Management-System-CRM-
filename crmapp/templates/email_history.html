{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Email History</title>
    <link rel="stylesheet" type="text/css" href="https://bootswatch.com/5/flatly/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="{% static 'css/styles.css' %}">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>
    {% include 'navdash.html' %}

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center">
            <h2>Email History</h2>
            <a href="{% url 'create_email_group' %}" class="btn btn-secondary">Back to Email Management</a>
        </div>
        
        <hr class="my-3 border border-secondary">
    
        <!-- Filter Form -->
        <form method="GET" id="filterForm">
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="groupFilter">Filter by Email Group:</label>
                    <select id="groupFilter" name="group_name" class="form-control">
                        <option value="all" {% if selected_group == "all" %}selected{% endif %}>All Groups</option>
                        {% for group in email_groups %}
                            <option value="{{ group.group_name }}" {% if group.group_name == selected_group %}selected{% endif %}>
                                {{ group.group_name }}
                            </option>
                        {% endfor %}
                    </select>
                </div>
            </div>
        </form>
    
        <table class="table table-hover table-bordered">
            <thead class="thead-light">
                <tr>
                    <th>Group Name</th>
                    <th>Subject</th>
                    <th>Sent At</th>
                </tr>
            </thead>
            <tbody id="emailHistoryTable">
                {% for email in email_history %}
                    <tr class="data-row" data-group="{{ email.group_name }}">
                        <td>{{ email.group }}</td>
                        <td>{{ email.subject }}</td>
                        <td>{{ email.sent_at }}</td>
                    </tr>
                {% empty %}
                    <tr>
                        <td colspan="3" class="text-center">No email history available.</td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
    
    <script>
        document.getElementById("groupFilter").addEventListener("change", function () {
            document.getElementById("filterForm").submit();
        });
        $(document).ready(function () {
            function filterTable() {
                var groupFilter = $('#groupFilter').val().toLowerCase();
                
                $('.data-row').each(function () {
                    var rowGroup = $(this).data('group').toLowerCase();
    
                    var showRow = (groupFilter === 'all' || rowGroup === groupFilter);
    
                    $(this).toggle(showRow);
                });
            }
    
            $('#groupFilter').on('change', filterTable);
        });
    </script>
</body>
</html>
