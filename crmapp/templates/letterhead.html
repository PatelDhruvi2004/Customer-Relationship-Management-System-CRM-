{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compose Email</title>
    <link rel="stylesheet" type="text/css" href="https://bootswatch.com/5/flatly/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>

<style>
    .back-button {
        background-color: #6c757d;
        border-color: #6c757d;
        transition: background-color 0.3s ease, border-color 0.3s ease;
    }

    .back-button:hover {
        background-color: #5a6268; /* Slightly darker shade */
        border-color: #545b62;
    }
</style>


<body>
    {% include 'navdash.html' %}

    {% block content %}

    <div class="container mt-4">

        {% if messages %}
                {% for message in messages %}
                    <div class="alert {% if message.tags == 'success' %}alert-success{% else %}alert-danger{% endif %} alert-dismissible fade show mt-3" role="alert">
                        {{ message }}
                        <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                            <span aria-hidden="true">&times;</span>
                        </button>
                    </div>
                {% endfor %}
        {% endif %}

        <div class="d-flex justify-content-between align-items-center">
            <h2>Compose Email</h2>
            <a href="{% url 'create_email_group' %}" class="btn btn-secondary back-button">
                Create New Email Group
            </a>
        </div>

        <hr class="my-3 border border-secondary">

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            
            <!-- To: Single Select Email Group -->
            <label for="to_email">To (Select Email Group):</label>
            <select id="to_email" name="to_email" class="form-control" required>
                <option value="" disabled selected>-- Select an Email Group --</option>
                {% for group in email_groups %}
                    <option value="{{ group.id }}">{{ group.group_name }}</option>
                {% endfor %}
            </select><br>
        
            <!-- Subject -->
            <label for="subject">Subject:</label>
            <input type="text" id="subject" name="subject" class="form-control" required><br>
        
            <!-- Email Body -->
            <label for="body">Body:</label>
            <textarea id="body" name="body" class="form-control" rows="5" required></textarea><br>
        
            <!-- Attachment: Allow Images & PDFs -->
            <label for="attachment">Attachments (Images/PDFs):</label>
            <input type="file" id="attachment" name="attachments" class="form-control" accept="image/*,application/pdf" multiple><br>

            <button type="submit" class="btn btn-primary mt-3">Send Email</button><br><br>

            

            <script>
                setTimeout(function() {
                    let alerts = document.querySelectorAll('.alert');
                    alerts.forEach(alert => {
                        alert.style.transition = "opacity 0.5s";
                        alert.style.opacity = "0";
                        setTimeout(() => alert.remove(), 500);
                    });
                }, 3000); // Hide after 3 seconds
            </script>

        </form>
    </div>

    {% endblock %}
</body>
</html>
