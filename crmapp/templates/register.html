
<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" type="text/css" href="https://bootswatch.com/5/flatly/bootstrap.min.css">
    <link rel="stylesheet" href="{%static "css/styles.css" %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <script src="https://kit.fontawesome.com/a076d05399.js"></script>
</head>
<style>
    .btn{
        background-color:#2c3e50 !important;
    }
</style>

{% block content %}

<body>

    {% include 'navbar1.html' %}

    <div class="container form-container">
        <h3 style="padding-top:27px;">Create your account</h3>
        <p>Start managing your clients today!</p>
        <hr>
        
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" class="form-control" name="uname" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="Email" class="form-control" name="uemail" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" name="upwd1" minlength="8" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Password confirmation</label>
                <input type="password" class="form-control" name="upwd2" minlength="8" required>
                <small class="form-text text-muted">Enter the same password as before, for verification.</small>
            </div>

            <button type="submit" class="btn btn-dark w-100">Create account &nbsp;<i class="fa fa-user"></i></button>
        </form>

        <div class="text-center mt-3" style="padding-bottom: 30px">
            <p>Already have an account?</p>
            <a href="{% url "login" %}" class="login-link">Login</a>
        </div>
    </div>

    <script src="{% static 'js/app.js' %}"></script>


    <script src="https://code.jquery.com/jquery-3.4.1.slim.min.js" integrity="sha384-J6qa4849blE2+poT4WnyKhv5vZF5SrPo0iEjwBvKU7imGFAV0wwj1yYfoRSJoZ+n" crossorigin="anonymous"></script>
    
    
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js" integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo" crossorigin="anonymous"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.min.js" integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6" crossorigin="anonymous"></script>




</body>
{% endblock %}

</html>
